[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "relaylm"
version = "0.1.0"
description = "RelayLM: verifiable backend engineering portfolio project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "httpx>=0.28,<1",
 "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1",
 "sqlalchemy[asyncio]>=2.0.40,<2.1", "asyncpg>=0.30,<1", "alembic>=1.16,<2",
 "pydantic-settings>=2.10,<3", "pyjwt>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
 "email-validator>=2.2,<3", "prometheus-client>=0.22,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "httpx>=0.28,<1", "ruff>=0.12,<1"]
[tool.hatch.build.targets.wheel]
packages = ["src/relaylm"]
[tool.pytest.ini_options]
addopts = "-q -o cache_dir=/tmp/pytest-cache"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
